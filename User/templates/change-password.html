{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <link rel="stylesheet" href="{% static 'auth.css' %}">
</head>

<body>
    <main>
        <div>
            <div id="main_heading_box">
                <h2>Change Password</h2>
                <p>Make Sure to Save Your New Password.</p>
            </div>
            <form class="form" id="u_change_pass" method="POST">
                {% csrf_token %}
                <div class="input-container">
                    <input id="u_new_password" name="new_password" type="password" placeholder=" " required>
                    <label for="u_new_password">New Password <span class="required-s">*</span></label>
                    <span class="error-text"></span>
                </div>

                <div class="input-container">
                    <input id="u_confirm_password" name="confirm_password" type="password" placeholder=" " required>
                    <label for="u_confirm_password">Confirm Password <span class="required-s">*</span></label>
                    <span class="error-text"></span>
                </div>
                
                <button type="submit">Update Password</button>
            </form>
        </div>
    </main>

    <script src="{% static 'auth.js' %}"></script>
</body>

</html>
