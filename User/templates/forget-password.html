{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <link rel="stylesheet" href="{% static 'auth.css' %}">
</head>

<body>
    <main>
        <div>
            <div id="main_heading_box">
                <h2>Forget Password</h2>
                <p>Please! Enter your Email Address to proceed.</p>
            </div>
            <form class="form" id="u_forget_pass" method="POST">
                {% csrf_token %}
                <div class="input-container">
                    <input id="u_email" name="email" type="email" placeholder=" " required>
                    <label for="u_email">Email Address <span class="required-star">*</span></label>
                    <span class="error-text"></span>
                </div>

                <button type="submit">Verify Email</button>
            </form>
        </div>
    </main>

    <script src="{% static 'auth.js' %}"></script>
</body>

</html>
