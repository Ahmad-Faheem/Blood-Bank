{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <link rel="stylesheet" href="{% static 'auth.css' %}">
</head>

<body>
    <main>
        <div>
            <div id="main_heading_box">
                <h2>Welcome Back</h2>
                <p>Enter your Credentials to Login to your Account.</p>
            </div>
            <form class="form" id="u_login" method="POST">
                {% csrf_token %}
                <div class='form_heading'>
                    <h4>Log In</h4>
                    <p>Enter your Credentials to Login to your Account.</p>
                </div>
                <div class="input-container">
                    <input id="u_email" name="email" type="email" placeholder=" " required>
                    <label for="u_email">Email Address <span class="required-star">*</span></label>
                    <span class="error-text"></span>
                </div>

                <div class="input-container">
                    <input id="u_password" name="password" type="password" placeholder=" " required>
                    <label for="u_password">Enter Your Password <span class="required-star">*</span></label>
                    <span class="error-text"></span>
                    <span id="non_field_errors"></span>
                </div>

                <div class="forgot-pass">
                    <a href="{% url 'User:forget_password' %}">Forgot Password?</a>
                </div>
                <button type="submit">Log In</button>
                <div class="form_bottom_line">
                    <p>Don't have an Account? </p>
                    <a id='signup' href="{% url 'User:register' %}">Register</a>
                </div>
            </form>
        </div>
    </main>

    <script src="{% static 'auth.js' %}"></script>
</body>

</html>
