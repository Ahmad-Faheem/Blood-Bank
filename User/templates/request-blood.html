{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <link rel="stylesheet" href="{% static 'styling.css' %}">
</head>
<body>

    <div class="wizard-container">
        <h2>Blood Request</h2>
        <p class="subtitle">Complete these 4 steps to submit a blood request.</p>

        <div class="stepper">
            <div class="step-circle active" id="step-1-circle">1</div>
            <div class="step-circle" id="step-2-circle">2</div>
            <div class="step-circle" id="step-3-circle">3</div>
            <div class="step-circle" id="step-4-circle">4</div>
        </div>

        <form id="blood-request-wizard" method="POST">
            {% csrf_token %}
            <div class="form-step active" id="step-1">
                <div class="form-grid">
                    <div class="input-container" style="display: none;">
                        <input id="email" name="email" type="email" placeholder=" " value="{{ user_email }}" required>
                        <label for="email">Email Address <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div class="input-container full-width">
                        <input id="patient_name" type="text" name="patient_name" placeholder=" " required>
                        <label for="patient_name">Patient Name <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div class="input-container">
                        <select id="blood_group" name="blood_group" required>
                            <option value="" selected disabled></option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                        <label for="blood_group">Blood Group <span class="required-star">*</span></label>
                    </div>
                    <div class="input-container">
                        <select id="blood_type" name="blood_type" required>
                            <option value="" selected disabled></option>
                            <option value="whole">Whole Blood</option>
                            <option value="prbc">Red Cells (PRBC)</option>
                            <option value="platelets">Platelets</option>
                            <option value="plasma">Plasma</option>
                        </select>
                        <label for="blood_type">Blood Type <span class="required-star">*</span></label>
                    </div>
                    <div class="input-container">
                        <input id="units_required" name="units_required" type="number" min="1" max="10" placeholder=" " required>
                        <label for="units_required">Number of Units <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div class="input-container">
                        <select id="urgency_level" name="urgency_level" required>
                            <option value="" selected disabled></option>
                            <option value="plan">Routine (planned)</option>
                            <option value="urgent">Urgent (4-6 Hours)</option>
                            <option value="emergency">Emergency (Immediate)</option>
                        </select>
                        <label for="urgency_level">Urgency Level <span class="required-star">*</span></label>
                    </div>
                    <div class="input-container" id="urgency_time_input">
                        <input id="urgency_time" name="urgency_time" type="number" min="1" max="10" placeholder=" ">
                        <label for="urgency_time">Urgency Time (Days) <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                </div>
            </div>
 
            <div class="form-step" id="step-2">
                <div class="form-grid">
                    <div class="input-container full-width">
                        <input id="hospital_name" name="hospital_name" type="text" placeholder=" " required>
                        <label for="hospital_name">Hospital Name <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div class="input-container full-width">
                        <input id="hospital_address" name="hospital_address" type="text" placeholder=" " required>
                        <label for="hospital_address">Hospital Address / Ward Name<span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div class="input-container">
                        <input id="doctor_name" name="doctor_name" type="text" placeholder=" " required>
                        <label for="doctor_name">Doctor's Name <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div id="country_code_input_box">
                        <select id="doctor_country_code" name="doctor_country_code">
                            <option value="+92" selected>+92 (PK)</option>
                            <option value="+91" >+91 (INR)</option>
                            <option value="+1">+1 (US)</option>
                        </select>
                        <div>
                            <input id="doctor_phone" name="doctor_phone" type="tel" required>
                            <label for="doctor_phone">Doctor's Phone Number <span class="required-star">*</span></label>
                            <span class="error-text"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-step" id="step-3">
                <div class="form-grid">
                    <div class="input-container full-width">
                        <input id="requester_name" name="requester_name" type="text" placeholder=" " required>
                        <label for="requester_name">Requester Name <span class="required-star">*</span></label>
                        <span class="error-text"></span>
                    </div>
                    <div id="country_code_input_box">
                        <select id="requester_country_code" name="requester_country_code">
                            <option value="+92" selected>+92 (PK)</option>
                            <option value="+1">+1 (US)</option>
                        </select>
                        <div>
                            <input id="requester_phone" name="requester_phone" type="tel" required>
                            <label for="requester_phone">Phone Number <span class="required-star">*</span></label>
                            <span class="error-text"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <select id="relationship" name="relationship" required>
                            <option value="" selected disabled></option>
                            <option value="self">Self</option>
                            <option value="relative">Family/Relative</option>
                            <option value="staff">Hospital Staff</option>
                        </select>
                        <label for="relationship">Relation to Patient <span class="required-star">*</span></label>
                    </div>
                </div>
            </div>

            <div class="form-step" id="step-4">
                <div class="form-grid">
                    <div class="file-input-group full-width">
                        <label for="prescription_doc">Doctor's Prescription <span class="required-star">*</span></label>
                        <div class="input-container">
                            <input id="prescription_doc" name="prescription_doc" type="file" accept="image/*,application/pdf" required>
                        </div>
                        <span class="error-text"></span>
                    </div>
                    <div class="input-container full-width">
                        <textarea id="additional_notes" name="additional_notes" placeholder=" "></textarea>
                        <label for="additional_notes">Additional Medical Notes (Optional)</label>
                    </div>
                </div>
                <div id="backend-global-errors" class="full-width hidden">
                    <div class="error-banner">
                        <p>Blood Request Blocked:</p>
                        <ul id="backend-error-list"></ul>
                    </div>
                </div>
            </div>

            <div class="btn-container">
                <button type="button" id="backBtn" class="btn-back hidden">Back</button>
                <button type="button" id="nextBtn" class="btn-next" style="margin-left: auto;">Next</button>
            </div>
        </form>
    </div>

    <script src="{% static 'request-blood.js' %}"></script>
</body>
</html>
